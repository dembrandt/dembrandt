name: Tailwind Watch

# The --tailwind export writes text, so a Tailwind release cannot break the
# build. Only a new major can invalidate the theme namespaces it emits. This
# checks weekly. On a new major it hands the update to an agent, which opens a
# PR against the emitter. Falls back to an issue when no agent credential is
# configured.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  # Job-level so every step's `if` can read it. A step cannot reliably read env
  # it defines on itself from its own `if` expression.
  HAS_AGENT: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Check published Tailwind major
        id: check
        run: |
          set +e
          out=$(node tools/tailwind-check.mjs 2>&1)
          code=$?
          echo "$out"
          {
            echo "report<<EOF"
            echo "$out"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      # Exit 2 is "npm was unreachable", not "something is wrong with the
      # emitter". Next Monday retries; a red scheduled job every time npm
      # hiccups only teaches you to ignore this workflow.
      - name: Note check failure
        if: steps.check.outputs.code == '2'
        run: echo "::warning::tailwind-check could not reach the registry; retrying next run."

      - name: Install dependencies
        run: npm ci

      # The compile tests pin tailwindcss exactly, so they only ever exercise
      # the version we froze. A minor that changes what a namespace means would
      # otherwise be seen by nothing: tailwind-check watches majors, and the
      # export pins nothing at runtime. This runs the same tests against the
      # published latest without moving the pin, so the pin stays a deliberate
      # choice rather than a blind spot.
      - name: Compile the emitted theme against the latest Tailwind
        id: latest
        continue-on-error: true
        run: |
          npm i --no-save tailwindcss@latest @tailwindcss/cli@latest
          npm run build
          node --test dist/test/tailwind-compile.test.js dist/test/tailwind-fixtures.test.js

      - name: Update the emitter
        id: agent
        if: (steps.check.outputs.code == '1' || steps.latest.outcome == 'failure') && env.HAS_AGENT == 'true'
        uses: anthropics/claude-code-action@24dcd50c0568f0fc9e9211213a4fd2d9eb15c4e0 # v1.0.200
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            One of two things happened: tailwindcss published a new major, or
            the emitted theme stopped compiling cleanly against the latest
            published Tailwind. Check which before assuming.

            Major check (exit 1 means a new major, 0 means still in sync):

            ${{ steps.check.outputs.report }}

            Compile against latest: ${{ steps.latest.outcome }}. If that says
            `failure`, read the job log for the assertion that broke. A minor
            can change what a namespace means without renaming it, and that
            failure is the only signal we get for it.

            The `--tailwind` export in `lib/formatters/tailwind.ts` emits a v4
            `@theme` block. Your job is to find out whether the new major
            changed anything it depends on, and to update it if so.

            Do this:

            1. Read `lib/formatters/tailwind.ts`, in particular
               `TAILWIND_TARGET_MAJOR`, `TAILWIND_NAMESPACES`, and every
               `build*` function that writes a namespaced variable.
            2. Find the new major's theme-variable documentation and its
               upgrade guide. For each namespace in `TAILWIND_NAMESPACES`,
               determine: does it still exist, is it still spelled the same,
               and does it still mean the same thing? The v3 -> v4 change (JS
               config to `@theme`) is the shape of break to look for.
            3. Apply whatever the answer requires. If nothing moved, the only
               change is bumping `TAILWIND_TARGET_MAJOR`. If a namespace was
               renamed or re-scoped, update the emitter, the tests in
               `test/tailwind.test.ts` that pin the old spelling, and the
               `UTILITY_FOR` mapping in `test/tailwind-compile.test.ts`.
            4. Bump the `tailwindcss` and `@tailwindcss/cli` devDependencies to
               the new major, pinned exactly, both on the same version. They
               exist only so `test/tailwind-compile.test.ts` can run the real
               compiler over the emitted theme; that test is the one that
               actually proves the namespaces work, so it must pass on the new
               major before you open the PR.
            5. Run `npm run build`, `npm test` and `npm run lint`. All must
               pass. Do not weaken an assertion to make a test pass; if a test
               now fails for a real reason, fix the emitter.
            6. Open a PR on a branch named `dem-tailwind-v<major>`.

            In the PR body, state plainly which namespaces you verified,
            which changed, and cite the doc page you checked each against. If
            you could not verify a namespace, say so rather than assuming it
            is unchanged. Keep the PR description terse: no marketing, no
            summary of what the export is for.

            Repo conventions: no em dashes, no Co-Authored-By trailer, terse
            commit messages.
          claude_args: |
            --allowed-tools Read,Edit,Write,WebFetch,WebSearch,Bash(npm run build),Bash(npm test),Bash(npm run lint),Bash(npm i *),Bash(npm view *),Bash(git *),Bash(gh pr create*)

      # No agent credential, or the agent run failed: fall back to the issue so
      # the signal is never silently dropped.
      - name: Open issue
        if: (steps.check.outputs.code == '1' || steps.latest.outcome == 'failure') && (env.HAS_AGENT != 'true' || steps.agent.outcome == 'failure')
        env:
          REPORT: ${{ steps.check.outputs.report }}
          LATEST: ${{ steps.latest.outcome }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const title = 'Tailwind: upstream moved, review the --tailwind export';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'tailwind-watch',
            });
            if (existing.data.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['tailwind-watch'],
              body: [
                '```',
                process.env.REPORT,
                '```',
                '',
                `Compile against the latest published Tailwind: **${process.env.LATEST}**.`,
              ].join('\n'),
            });
