name: Nightly Liveness

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  liveness:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build
        run: npm run build

      - name: Liveness chunk ${{ matrix.chunk }}
        run: |
          node -e "
            const sites = JSON.parse(require('fs').readFileSync('test/sites.json','utf8'));
            const chunk = sites.filter((_, i) => i % 4 === ${{ matrix.chunk }});
            require('fs').writeFileSync('test/sites-chunk.json', JSON.stringify(chunk));
            console.log('Chunk ${{ matrix.chunk }}:', chunk.join(', '));
          "
          node test/liveness.mjs sites-chunk.json
        env:
          CI: true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-liveness-${{ matrix.chunk }}
          path: test/liveness-report.json
          retention-days: 30
